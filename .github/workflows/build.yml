name: Build plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DAETHER_STANDALONE=OFF
      - name: Build VST3 + AU (universal)
        run: cmake --build build --config Release --target Aether_VST3 Aether_AU -- -quiet
      - name: Ad-hoc sign and package
        run: |
          mkdir -p dist
          cp -R build/Aether_artefacts/Release/VST3/Aether.vst3 dist/
          cp -R build/Aether_artefacts/Release/AU/Aether.component dist/
          codesign --force --deep --sign - dist/Aether.vst3
          codesign --force --deep --sign - dist/Aether.component
          lipo -info dist/Aether.vst3/Contents/MacOS/Aether
          cp packaging/INSTALL-mac.txt dist/
          cp packaging/install-mac.command dist/ && chmod +x dist/install-mac.command
          cd dist && ditto -c -k --keepParent . ../Aether-mac.zip
      - name: Validate AU
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R dist/Aether.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Aeth Lgnx | tail -20
      - uses: actions/upload-artifact@v4
        with:
          name: Aether-mac
          path: Aether-mac.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DAETHER_STANDALONE=OFF
      - name: Build VST3
        run: cmake --build build --config Release --target Aether_VST3
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse build/Aether_artefacts/Release/VST3/Aether.vst3 dist/
          Copy-Item packaging/INSTALL-windows.txt dist/
          Compress-Archive -Path dist/* -DestinationPath Aether-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Aether-windows
          path: Aether-windows.zip

  release:
    needs: [macos, windows]
    if: always() && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish latest build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Aether (latest build)
          prerelease: true
          make_latest: true
          body: "Automatic build from ${{ github.sha }}. Download Aether-mac.zip for Mac (VST3 + AU) or Aether-windows.zip for Windows (VST3)."
          files: out/**/*.zip
